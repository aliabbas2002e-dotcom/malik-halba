<style>

#lock{position:absolute;top:58%;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:7px 22px;font-weight:700}

#touch{display:none}

#stick{position:absolute;left:24px;bottom:28px;width:130px;height:130px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(20,16,32,.35);pointer-events:auto;touch-action:none}

#bA{right:24px;bottom:30px;width:88px;height:88px;background:rgba(244,183,62,.5);border-color:var(--gold)}
#bB{right:124px;bottom:22px;width:64px;height:64px}
#bD{right:40px;bottom:130px;width:64px;height:64px}
@media (max-height:480px){.tp{width:128px;padding:3px 7px 4px}.tpt{font-size:11px}.pip em{width:40px;font-size:10px}.pip{margin-top:1px}.clock{min-width:70px;padding:2px 8px}.clock b{font-size:14px}.clock small{font-size:10px}#hud{top:4px;gap:5px}#feed{top:80px;font-size:11px}.lb{font-size:11px}.lb i{width:46px;height:5px}.dmg{font-size:18px}.dmg.big{font-size:28px}#me{bottom:8px;min-width:170px;width:28vw;padding:4px 9px 6px}.mt{font-size:11px}.mhp{height:12px}.mhp b{line-height:12px;font-size:10px}.card{padding:18px}.crest{font-size:30px}h1{font-size:34px}}
</style>

<body>
<canvas id="c"></canvas>
<section id="home" class="screen on"><div class="card">
  <span class="crest" aria-hidden="true">♛</span>
  <h1>ملك الحلبة</h1><p class="sub">٣ فرق، بكل فريق ملك ومقاتل. احمِ ملكك واقتل ملوكهم</p>
  <label for="nm">اسمك</label><input id="nm" maxlength="12" placeholder="علي" autocomplete="off">
  <div class="row"><button id="create" class="btn pri">سوّي غرفة</button></div>
  <div class="or">أو ادخل بكود</div>
  <div class="row"><input id="cd" maxlength="4" placeholder="ABCD" style="direction:ltr;text-align:center;text-transform:uppercase;letter-spacing:4px" autocomplete="off"><button id="join" class="btn" style="width:130px;flex:none">ادخل</button></div>
  <div id="err" class="err"></div>
</div></section>

<section id="lobby" class="screen"><div class="card">
  <div class="lhead"><div><small>كود الغرفة</small><div id="lcode" class="code"></div></div><button id="copy" class="btn">انسخ رابط الدعوة</button></div>
  <div id="teams"></div>
  <div class="row"><button id="start" class="btn pri">ابدي العركة</button></div>
  <div id="lmsg" class="err"></div>
</div></section>

<div id="game">
  <div id="labels"></div><div id="hud"></div><div id="feed"></div><div id="banner"></div>
  <div id="xh"></div><div id="dead"></div><div id="lock">كليك حتى تتحكم بالنظر</div>
  <div id="help">ماوس للنظر · WASD حركة · كليك ضربة · اضغط مطول ضربة قوية · Shift أو كليك يمين صد · Space تفادي</div>
  <div id="me"><div class="mt"><span id="mRole"></span><span id="mWp"></span></div><div class="mhp"><u id="mFill"></u><b id="mHp"></b></div><div class="mds"><u id="mDash"></u></div></div>
  <div id="touch"><div id="stick"><div id="knob"></div></div><div id="bA" class="tb">ضربة</div><div id="bB" class="tb">صد</div><div id="bD" class="tb">تفادي</div></div>
  <div id="rot">دوّر الموبايل بالعرض حتى تلعب</div>
  <div id="over"><div class="card"><span class="crest" aria-hidden="true">♛</span><h1 id="otitle"></h1><div id="stats"></div><button id="again" class="btn pri">رجوع للغرفة</button></div></div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<script>
const SB_URL='https://xrxkyposmjwtqvwlmiem.supabase.co',SB_KEY='sb_publishable_TMXrM-gNsYMwANbd8SOLxg_q_rUmFDf';
const sb=supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:40}}});
const $=i=>document.getElementById(i);
const TN=['البنفسجي','الأخضر','البرتقالي'],TC=['#8b7cf6','#2fc79c','#f0784a'],RN=['الملك','المقاتل'];
const W=1360,H=880,PR=19,CX=680,CY=412,TX=680,TY=393;
const WALLS=[[404,155,191,27],[765,155,191,27],[376,468,27,170],[957,468,27,170]];
const BASES=[[40,36,240,195],[1080,36,240,195],[560,600,240,180]];

const WP=[{n:'إيد',d:12,r:60,arc:1.5,cd:.36},{n:'سيف',d:20,r:88,arc:1.8,cd:.46},{n:'رمح',d:17,r:135,arc:.55,cd:.55},{n:'قوس',d:15,cd:.7,bow:1},{n:'مطرقة العرش',d:38,r:105,arc:2.4,cd:.85}];
const STAT=[{hp:170,sp:178,m:1},{hp:100,sp:236,m:1.2}];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pid=Math.random().toString(36).slice(2,10);
const A={code:'',host:false,name:'',players:[],ph:'home',stateCh:null,inCh:null,guests:{},lastL:0,hostId:null};
window.__mh=A;

function show(id){for(const s of ['home','lobby'])$(s).classList.toggle('on',s===id);$('game').classList.toggle('on',id==='game')}
function chan(n,pres){return sb.channel(n,{config:{broadcast:{self:false,ack:false},presence:pres?{key:pid}:undefined}})}
function send(ch,ev,payload){if(ch)ch.send({type:'broadcast',event:ev,payload})}
function genCode(){const s='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=s[Math.floor(Math.random()*s.length)];return c}
function getName(){const n=$('nm').value.trim().slice(0,12);if(!n){$('err').textContent='اكتب اسمك أول';return null}$('err').textContent='';try{localStorage.setItem('mh_n',n)}catch(e){}return n}
function connect(code,host){
  A.code=code;A.host=host;A.lastL=performance.now();
  const ch=chan('mh:'+code+':s',true);A.stateCh=ch;
  ch.on('broadcast',{event:'l'},m=>onLobby(m.payload));
  ch.on('broadcast',{event:'g'},m=>onSnap(m.payload));
  ch.on('presence',{event:'sync'},()=>{if(A.host)onPresence(ch.presenceState())});
  ch.subscribe(s=>{if(s==='SUBSCRIBED'){ch.track({n:A.name});if(host){addPlayer(pid,A.name);broadcastLobby();show('lobby')}}});
  if(!host){
    const ic=chan('mh:'+code+':i:'+pid,false);A.inCh=ic;
    ic.subscribe(s=>{if(s==='SUBSCRIBED'){clearInterval(A.ji);A.ji=setInterval(()=>{if(!A.joined)send(ic,'i',{j:A.name})},700)}});
  }
}
function leave(msg){clearInterval(A.ji);for(const k in A.guests)sb.removeChannel(A.guests[k]);A.guests={};if(A.stateCh)sb.removeChannel(A.stateCh);if(A.inCh)sb.removeChannel(A.inCh);A.stateCh=A.inCh=null;A.joined=false;A.ph='home';A.host=false;A.players=[];G=null;show('home');$('err').textContent=msg||''}
setInterval(()=>{if(A.host){if(A.ph!=='home')broadcastLobby()}else if(A.stateCh&&performance.now()-A.lastL>15000){leave(A.joined?'صاحب الغرفة طلع، انتهت اللعبة':'ماكو غرفة بهذا الكود')}},1500);

/* ---------- lobby (host authority) ---------- */
function addPlayer(id,n){if(A.players.find(p=>p.id===id)||A.players.length>=6||A.ph==='game')return;
  const name=String(n||'لاعب').slice(0,12);let t=-1,r=0;
  outer:for(const rr of [0,1])for(let tt=0;tt<3;tt++)if(!A.players.find(p=>p.t===tt&&p.r===rr)){t=tt;r=rr;break outer}
  A.players.push({id,n:name,t,r});broadcastLobby()}
function onPresence(st){
  for(const k in st)if(k!==pid&&!A.guests[k]){const c=chan('mh:'+A.code+':i:'+k,false);c.on('broadcast',{event:'i'},m=>onGuest(k,m.payload));c.subscribe();A.guests[k]=c}
  for(const k in A.guests)if(!st[k]){sb.removeChannel(A.guests[k]);delete A.guests[k];
    if(A.ph==='game'&&G){const i=G.roster.findIndex(p=>p.id===k);if(i>=0)goneEnt(i)}else{A.players=A.players.filter(p=>p.id!==k);broadcastLobby()}}
}
function onGuest(id,m){if(!m)return;
  if(m.j!==undefined){addPlayer(id,m.j);return}
  if(m.sl){setSlot(id,m.sl[0],m.sl[1]);return}

function goLand(){if(!touchMode)return;try{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(r&&r.then)r.then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}}
$('create').onclick=()=>{const n=getName();if(!n)return;goLand();A.name=n;connect(genCode(),true)};
$('join').onclick=()=>{const n=getName();if(!n)return;goLand();const c=$('cd').value.trim().toUpperCase();if(c.length!==4){$('err').textContent='الكود ٤ حروف';return}A.name=n;$('err').textContent='جاي أدخل...';connect(c,false)};
$('copy').onclick=async()=>{const u=location.origin+location.pathname+'?r='+A.code;try{await navigator.clipboard.writeText(u);$('copy').textContent='انتسخ الرابط'}catch(e){$('copy').textContent=u}setTimeout(()=>$('copy').textContent='انسخ رابط الدعوة',2500)};
$('start').onclick=()=>{if(A.host)startHostGame()};
$('again').onclick=()=>{if(A.host){G=null;A.ph='lobby';A.players=A.players.filter(p=>!p.gone);broadcastLobby()}};
</script>
<script type="module" src="game3d.js"></script>
